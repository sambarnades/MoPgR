name: Moodle-Postgres-Redis Network
networks:
  moodle-network:
services:
    php_server:
      container_name: php_server_$BRANCH
      environment:
        - GIT_REMOTE_REPO_URL=${GIT_REMOTE_REPO_URL}
        - MOODLE_WWWROOT=${MOODLE_WWWROOT:-http://127.0.0.1}
        - MOODLE_LANG=${MOODLE_LANG:-fr}
        - MOODLE_DATAROOT=${MOODLE_DATAROOT:-/data/moodledata}
        - MOODLE_DBTYPE=${MOODLE_DBTYPE:-pgsql}
        - MOODLE_DBHOST=${MOODLE_DBHOST:-postgres}
        - MOODLE_DBNAME=${MOODLE_DBNAME:-moodle}
        - MOODLE_DBUSER=${MOODLE_DBUSER:-moodleadmin}
        - MOODLE_DBPASS=${MOODLE_DBPASS:-moodlepass}
        - MOODLE_DBPREFIX=${MOODLE_DBPREFIX:-mdl_}
        - MOODLE_ADMINUSER=${MOODLE_ADMINUSER:-moodle}
        - MOODLE_ADMINPASS=${MOODLE_ADMINPASS:-moodlepass}
        - MOODLE_ADMINEMAIL=${MOODLE_ADMINEMAIL:-admin@moodle.com}
        - MOODLE_SUPPORTEMAIL=${MOODLE_SUPPORTEMAIL:-support@moodle.com}
        - MOODLE_FULLNAME=${MOODLE_FULLNAME:-Moodle}
        - MOODLE_SHORTNAME=${MOODLE_SHORTNAME:-Moodle}
        - MOODLE_SSLPROXY=${MOODLE_SSLPROXY:-false}
      build:
        context: .
        dockerfile: php_server.Dockerfile
        args:
        - GIT_REMOTE_REPO_URL=${GIT_REMOTE_REPO_URL}
      healthcheck:
        test: ["CMD", "curl", "-f", "http://127.0.0.1:80/" ]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
      restart: unless-stopped
      depends_on:
        postgres:
          condition: service_healthy
      volumes:
       - ./docker_data/moodledata:/data/moodledata
    postgres:
      container_name: postgres_$BRANCH
      image: postgres:${POSTGRES_VERSION}
      restart: always
      # set shared memory limit when using docker compose
      shm_size: 128mb
      # or set shared memory limit when deploy via swarm stack
      #volumes:
      #  - type: tmpfs
      #    target: /dev/shm
      #    tmpfs:
      #      size: 134217728 # 128*2^20 bytes = 128Mb*
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
        ALLOW_EMPTY_PASSWORD: ${ALLOW_EMPTY_PASSWORD}
        PGDATA: ${PGDATA}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost -p 5432"]
        interval: 5s
        timeout: 5s
        retries: 5
      volumes:
        - ./docker_data/postgres:/var/lib/postgresql/18/docker
    pgadmin:
      container_name: pgadmin_$BRANCH
      image: elestio/pgadmin:latest
      restart: always
      environment:
        PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
        PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
        PGADMIN_LISTEN_PORT: 8443
      depends_on:
        postgres:
          condition: service_healthy
      volumes:
      - ./docker_data/pgadmin/servers.json:/docker_data/pgadmin4/servers.json
    redis:
      container_name: redis_$BRANCH
      image: redis:${REDIS_VERSION}
      restart: unless-stopped
      environment:
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        REDIS_USERNAME: ${REDIS_USERNAME}
        # REDIS_SS: ${REDIS_SS}
        REDIS_CA_PATH: ${REDIS_CA_PATH}
        REDIS_SSL_KEYFILE: ${REDIS_SSL_KEYFILE}
        REDIS_SSL_CERTFILE: ${REDIS_SSL_CERTFILE}
        REDIS_CERT_REQS: ${REDIS_CERT_REQS}
        REDIS_CA_CERTS: ${REDIS_CA_CERTS}
        REDIS_CLUSTER_MODE: ${REDIS_CLUSTER_MODE}
        REDIS_PWD: ${REDIS_PWD}
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 3
      volumes:
        - ./docker_data/moodle_redis:/docker_data/redis-data
    redisinsight:
      container_name: redisinsight_$BRANCH
      image: redis/redisinsight:${REDISINSIGHT_VERSION}
      restart: always
      environment:
        RI_APP_PORT: 5540
        RI_APP_HOST: 0.0.0.0
      volumes:
        - ./docker_data/moodle_redisinsight:/docker_data/redisinsight-db
volumes:
  docker_moodledata:
  docker_postgres:
  docker_redis:
  docker_redisinsight:
    